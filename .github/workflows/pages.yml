name: Deploy wardrobe app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Include app enhancements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          tags=[
              '<script src="./weather-widget.js?v=3"></script>',
              '<script src="./builder-v2.js?v=1"></script>',
              '<script src="./add-tab.js?v=1"></script>',
              '<script src="./profile-current.js?v=1"></script>'
          ]
          for tag in tags:
              if tag not in h:
                  h=h.replace('</body>',tag+'</body>')
          p.write_text(h,encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check weather-widget.js
          node --check builder-v2.js
          node --check add-tab.js
          node --check profile-current.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if scripts:
              Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          if [ -f /tmp/app.js ]; then node --check /tmp/app.js; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
