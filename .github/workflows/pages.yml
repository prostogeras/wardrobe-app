name: Deploy wardrobe app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add daily weather outfit card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          css = base64.b64decode('').decode()
          js = base64.b64decode('').decode()

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('</style>', css + '</style>', 1)
          html = html.replace('</body>', '<script>' + js + '</script></body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if scripts:
              Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          if [ -f /tmp/app.js ]; then node --check /tmp/app.js; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
