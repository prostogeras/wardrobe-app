name: Deploy wardrobe app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ID-safe cartoon clothing sprite
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy opencv-python-headless
          python scripts/generate_clothing_icons.py

      - name: Validate sprite mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          expected=['B-01','B-02','B-03','B-04','T-01','T-02','T-03','T-04','T-05','H-01','H-02','S-01','S-02','S-03','S-04','LS-01','LS-02','SH-01','SH-02','SH-03','SH-04','J-01','J-02','J-03','J-04']
          manifest=json.loads(Path('wardrobe_icons.json').read_text(encoding='utf-8'))
          actual=list(manifest['items'].keys())
          assert actual==expected
          assert len(set(actual))==25
          for index,item_id in enumerate(expected):
              assert manifest['items'][item_id]['target']=={'col':index%5,'row':index//5}
          assert Image.open('wardrobe_icons.webp').size==(1500,1900)
          PY

      - name: Include app enhancements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          tags=[
              '<script src="./weather-widget.js?v=3"></script>',
              '<script src="./builder-v2.js?v=1"></script>',
              '<script src="./add-tab.js?v=2"></script>',
              '<script src="./add-simple-v3.js?v=1"></script>',
              '<script src="./profile-current.js?v=1"></script>',
              '<script src="./home-layout-v2.js?v=1"></script>',
              '<script src="./icons-v4.js?v=2"></script>',
              '<script src="./swipe-tabs.js?v=1"></script>'
          ]
          for tag in tags:
              if tag not in h:
                  h=h.replace('</body>',tag+'</body>')
          p.write_text(h,encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check weather-widget.js
          node --check builder-v2.js
          node --check add-tab.js
          node --check add-simple-v3.js
          node --check profile-current.js
          node --check home-layout-v2.js
          node --check icons-v4.js
          node --check swipe-tabs.js
          test -s wardrobe_icons.webp
          test -s wardrobe_icons.json
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if scripts:
              Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          if [ -f /tmp/app.js ]; then node --check /tmp/app.js; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
