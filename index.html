<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#f4f1eb;--card:#fff;--text:#171717;--muted:#77716a;--line:#ded7cd;--accent:#6d765a}

<body><header><h1>Гардероб Кости</h1><p>25 вещей, кликабельные карточки, конструктор образов и подготовка запроса на реалистичную примерку.</p></header>
<nav><button data-view="catalog" class="active">Гардероб</button><button data-view="builder">Собрать образ</button><button data-view="saved">Сохранённые</button></nav>

H-02","name":"Белая рубашка Nike","cat":"Рубашки","color":"Молочно-белый","style":"Sport smart casual","flat":"assets/SH_02_flat.jpg","worn":"assets/SH_02_worn.jpg","slot":"layer","flatKey":"SH-02_flat","wornKey":"SH-02_worn"},{"id":"SH-03","name":"Выстиранная графитовая overshirt","cat":"Рубашки","color":"Графитовый","style":"Workwear","flat":"assets/SH_03_flat.jpg","worn":"assets/SH_03_worn.jpg","slot":"layer","flatKey":"SH-03_flat","wornKey":"SH-03_worn"},{"id":"SH-04","name":"Тёмная лёгкая рубашка","cat":"Рубашки","color":"Тёмно-серый","style":"Relaxed casual","flat":"assets/SH_04_flat.jpg","worn":"assets/SH_04_worn.jpg","slot":"layer","flatKey":"SH-04_flat","wornKey":"SH-04_worn"},{"id":"J-01","name":"Чёрный классический пиджак","cat":"Верхняя одежда","color":"Чёрный","style":"Smart","flat":"assets/J_01_flat.jpg","worn":"assets/J_01_worn.jpg","slot":"outer","flatKey":"J-01_flat","wornKey":"J-01_worn"},{"id":"J-02","name":"Varsity-бомбер с нашивками","cat":"Верхняя одежда","color":"Чёрный / молочный / красный","style":"Japanese streetwear","flat":"assets/J_02_flat.jpg","worn":"assets/J_02_worn.jpg","slot":"outer","flatKey":"J-02_flat","wornKey":"J-02_worn"},{"id":"J-03","name":"Чёрная coach jacket","cat":"Верхняя одежда","color":"Чёрный","style":"Minimal street","flat":"assets/J_03_flat.jpg","worn":"assets/J_03_worn.jpg","slot":"outer","flatKey":"J-03_flat","wornKey":"J-03_worn"},{"id":"J-04","name":"Оливковое полупальто","cat":"Верхняя одежда","color":"Оливковый","style":"Smart casual","flat":"assets/J_04_flat.jpg","worn":"assets/J_04_worn.jpg","slot":"outer","flatKey":"J-04_flat","wornKey":"J-04_worn"}]; const pos={"B-01_flat":{"x":0,"y":0},"B-01_worn":{"x":300,"y":0},"B-02_flat":{"x":600,"y":0},"B-02_worn":{"x":900,"y":0},"B-03_flat":{"x":1200,"y":0},"B-03_worn":{"x":1500,"y":0},"B-04_flat":{"x":1800,"y":0},"B-04_worn":{"x":2100,"y":0},"T-01_flat":{"x":0,"y":380},"T-01_worn":{"x":300,"y":380},"T-02_flat":{"x":600,"y":380},"T-02_worn":{"x":900,"y":380},"T-03_flat":{"x":1200,"y":380},"T-03_worn":{"x":1500,"y":380},"T-04_flat":{"x":1800,"y":380},"T-04_worn":{"x":2100,"y":380},"T-05_flat":{"x":0,"y":760},"T-05_worn":{"x":300,"y":760},"H-01_flat":{"x":600,"y":760},"H-01_worn":{"x":900,"y":760},"H-02_flat":{"x":1200,"y":760},"S-01_flat":{"x":1500,"y":760},"S-01_worn":{"x":1800,"y":760},"S-02_flat":{"x":2100,"y":760},"S-02_worn":{"x":0,"y":1140},"S-03_flat":{"x":300,"y":1140},"S-04_flat":{"x":600,"y":1140},"S-04_worn":{"x":900,"y":1140},"LS-01_flat":{"x":1200,"y":1140},"LS-01_worn":{"x":1500,"y":1140},"LS-02_flat":{"x":1800,"y":1140},"LS-02_worn":{"x":2100,"y":1140},"SH-01_flat":{"x":0,"y":1520},"SH-01_worn":{"x":300,"y":1520},"SH-02_flat":{"x":600,"y":1520},"SH-02_worn":{"x":900,"y":1520},"SH-03_flat":{"x":1200,"y":1520},"SH-03_worn":{"x":1500,"y":1520},"SH-04_flat":{"x":1800,"y":1520},"SH-04_worn":{"x":2100,"y":1520},"J-01_flat":{"x":0,"y":1900},"J-01_worn":{"x":300,"y":1900},"J-02_flat":{"x":600,"y":1900},"J-02_worn":{"x":900,"y":1900},"J-03_flat":{"x":1200,"y":1900},"J-03_worn":{"x":1500,"y":1900},"J-04_flat":{"x":1800,"y":1900},"J-04_worn":{"x":2100,"y":1900},"body_front":{"x":0,"y":2280}}; const COLS=8, ROWS=7;
const $=s=>document.querySelector(s), byId=id=>items.find(x=>x.id===id); let active='Все', selected={outer:null,layer:null,top:null,bottom:null}, current=null;
function picStyle(key){const p=pos[key]; if(!p)return ''; const col=p.x/300,row=p.y/380; return `background-position:${-col*100/7}% ${-row*100/6}%`;}
function pic(key,cls='pic'){return `<div class="${cls}" style="${picStyle(key)}"></div>`}
function nav(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');if(b.dataset.view==='saved')renderSaved()})}
function renderCatalog(){const cats=['Все',...new Set(items.map(x=>x.cat))];$('#filters').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" data-c="${c}">${c}</button>`).join('');document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{active=b.dataset.c;renderCatalog()});const list=items.filter(x=>active==='Все'||x.cat===active);$('#grid').innerHTML=list.map(x=>`<article class="card">${pic(x.flatKey)}<div class="info" data-open="${x.id}"><div class="code">${x.id}</div><div class="name">${x.name}</div><div class="meta">${x.color} · ${x.style}</div></div><button class="add" data-add="${x.id}">Добавить в образ</button></article>`).join('');document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openItem(el.dataset.open));document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{const x=byId(el.dataset.add);selected[x.slot]=x.id;renderBuilder();document.querySelector('[data-view=builder]').click()})}
const labels={outer:'Верхняя одежда',layer:'Рубашка / слой',top:'Основной верх',bottom:'Низ'};
function renderBuilder(){const slots=['outer','layer','top','bottom'];$('#body').style=picStyle('body_front');$('#pickers').innerHTML=slots.map(s=>`<div class="picker"><h2>${labels[s]}</h2><div class="row" id="row_${s}"></div></div>`).join('');slots.forEach(s=>{const a=items.filter(x=>x.slot===s);$('#row_'+s).innerHTML=`<button class="pick ${!selected[s]?'active':''}" data-id=""><b>Без вещи</b></button>`+a.map(x=>`<button class="pick ${selected[s]===x.id?'active':''}" data-id="${x.id}">${pic(x.flatKey)}<b>${x.id} · ${x.name}</b></button>`).join('');document.querySelectorAll('#row_'+s+' .pick').forEach(b=>b.onclick=()=>{selected[s]=b.dataset.id||null;renderBuilder()})});$('#chips').innerHTML=slots.map(s=>{const x=byId(selected[s]);return x?`<div class="chip">${pic(x.flatKey)}<span>${x.id}</span></div>`:`<div class="chip"><span style="padding:40px 5px">—</span></div>`}).join('')}
function code(){return ['outer','layer','top','bottom'].map(s=>selected[s]).filter(Boolean).join(' + ')}
$('#random').onclick=()=>{['outer','layer','top','bottom'].forEach(s=>{const a=items.filter(x=>x.slot===s);selected[s]=Math.random()<.22&&s!=='bottom'?null:a[Math.floor(Math.random()*a.length)]?.id||null});renderBuilder()};
$('#save').onclick=()=>{if(!code())return alert('Сначала выбери вещи');const a=JSON.parse(localStorage.getItem('kostyaLooks')||'[]');a.unshift({...selected,date:new Date().toLocaleDateString('ru-RU')});localStorage.setItem('kostyaLooks',JSON.stringify(a.slice(0,50)));alert('Образ сохранён')};
$('#tryon').onclick=async()=>{if(!code())return alert('Сначала выбери вещи');const chosen=['outer','layer','top','bottom'].map(s=>byId(selected[s])).filter(Boolean);const text=`Создай реалистичную фотографию меня в комплекте ${code()} из моего цифрового гардероба. Вещи: ${chosen.map(x=>x.name).join(', ')}. Сохрани мою внешность, телосложение, татуировки, естественную посадку и реальные цвета вещей. Полный рост, фронтальный ракурс, нейтральное освещение.`;$('#request').style.display='block';$('#request').innerHTML='<b>'+code()+'</b><br><br>'+text+'<br><br><small>Запрос скопирован — отправь его в чат.</small>';try{await navigator.clipboard.writeText(text)}catch(e){}};
function renderSaved(){const a=JSON.parse(localStorage.getItem('kostyaLooks')||'[]');$('#savedList').innerHTML=a.length?a.map((o,i)=>{const ids=['outer','layer','top','bottom'].map(s=>o[s]).filter(Boolean);return `<article class="saved"><h3>${ids.join(' + ')}</h3><p>${ids.map(id=>byId(id)?.name).filter(Boolean).join(' · ')}<br>${o.date||''}</p><button data-del="${i}">Удалить</button></article>`}).join(''):'<div class="empty">Сохранённых образов пока нет.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=JSON.parse(localStorage.getItem('kostyaLooks')||'[]');a.splice(+b.dataset.del,1);localStorage.setItem('kostyaLooks',JSON.stringify(a));renderSaved()})}
function openItem(id){current=byId(id);$('#modalId').textContent=current.id+' · '+current.cat;$('#modalName').textContent=current.name;$('#modalMeta').textContent=current.color+' · '+current.style;setMode(current.wornKey?'worn':'flat');$('#worn').disabled=!current.wornKey;$('#modal').classList.add('open')}
function setMode(m){$('#modalPic').style=picStyle(m==='worn'&&current.wornKey?current.wornKey:current.flatKey)} $('#worn').onclick=()=>setMode('worn');$('#flat').onclick=()=>setMode('flat');$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
nav();renderCatalog();renderBuilder();
</script></body></html>
